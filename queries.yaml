    - {id: europese_commissie, q: 'intitle:Prosus intitle:"Europese Commissie"', lang: nl}
    - {id: aandeelhouders, q: 'intitle:Prosus intitle:aandeelhouders', lang: nl}
    - {id: toezichthouder, q: 'intitle:Prosus intitle:toezichthouder', lang: nl}

# Drop a row when `pattern` (Python regex) matches the title. Google News titles end in " - <Source>",
# and the feed summary repeats the title, so title matching covers title+summary.
# `unless`: keep the row anyway if the title also names the company (company_names below).
company_names:
  prosus: '(?i)(Prosus|Naspers)'
  peer_deliveryhero: '(?i)Delivery Hero'
  peer_zalando: '(?i)Zalando'
exclusions:
  - id: job_ads
    pattern: '(?i)\b(vacature|vacancy|vacancies|job opening|now hiring|we.re hiring|careers at|jobs at)\b'
    reason: job ads
  - id: auto_stock_ticks
    pattern: '(?i)- (ad-hoc-news\.de|AD HOC NEWS)$'
    reason: auto-generated stock-tick pieces (29 Prosus, 43 Delivery Hero, 35 Zalando in 30 days); real news on the same events comes from other outlets
  - id: stock_tip_sites
    pattern: '(?i)- (Simply Wall St(reet)?|Traders Union|GuruFocus|Stocktwits|Capital\.com|Admirals|TIKR\.com|Benzinga)$'
    reason: stock-tip and valuation spam
  - id: forecast_spam
    pattern: '(?i)(stock forecast|price prediction|koersverwachting|analyst predictions)'
    reason: stock-tip spam
  - id: quote_pages
    pattern: '(?i)(stock price, news, quote|income statement|valuation measures|analyst ratings, estimates|stock holders - institutional|interactive stock chart|company profile & facts|options chain|stock forum & discussion|stock major holders)'
    reason: quote and directory pages, not news
  - id: ticker_valuation
    pattern: '\((ENXTAM|XTRA|OTCMKTS|JSE|CEUX):[A-Z0-9.]+\)'
    reason: ticker-tagged valuation write-ups (mostly Simply Wall St syndicated via Yahoo); stock-tip spam
  - id: directories
    pattern: '(?i)(funding rounds & list of investors|- Tracxn$|venture capital funds in)'
    reason: investor directory pages
  - id: live_scores
    pattern: '(?i)(live score|- Sofascore$)'
    reason: esports scores matched "Prosus results"
  - id: sponsorship_sport
    pattern: '(?i)(ZALANDO ARRIVAL MOMENT|Royal Belgian FA$|Red Flames|Rode Duivel)'
    reason: Zalando football sponsorship posts, not company news
  - id: shopping_giveaways
    pattern: '(?i)(kortingscode|discount code|promo code|^win |smart shopping day|webwinkels|hardloopitems)'
    reason: consumer shopping and giveaway content matching "Zalando"
  - id: market_wrap_no_name
    pattern: '(?i)\b(AEX|Damrak|Beursupdate|Bel20|Europese beurzen|Aziatische beurzen|Dow Jones|DAX|JSE|Wall Street)\b'
    unless: company_name
    reason: market wrap whose headline does not name the company

peers:
  peer_deliveryhero:
    name: Delivery Hero
    queries:
      - {id: name, q: '"Delivery Hero"', lang: any}
      - {id: title, q: 'intitle:"Delivery Hero"', lang: any}
      - {id: results, q: 'intitle:"Delivery Hero" intitle:results', lang: en}
  peer_zalando:
    name: Zalando
    queries:
      - {id: name, q: 'Zalando', lang: any}
      - {id: title, q: 'intitle:Zalando', lang: any}
      - {id: results, q: 'intitle:Zalando intitle:results', lang: en}
