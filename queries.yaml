# queries.yaml -- Google News search terms for collect.py (window C, tested 2026-10-19)
#
# Each phrase:
#   id    short slug; feed name = gn_<edition>_<group>_<key>_<id>  (see feeds.yaml, section googlenews)
#   q     exact Google News query; collect.py appends googlenews.window_suffix, then URL-encodes
#   lang  language of the phrase: en | nl | any (names). Every phrase is requested in BOTH editions.
#
# Query syntax (tested): "..." exact phrase; intitle:X = X must be in the headline.
# Topic phrases use `intitle:Prosus intitle:<keyword>`: plain `Prosus <keyword>` matched article
# bodies and returned 55-100% off-topic items (market wraps, unrelated AI news); see feeds.yaml, section googlenews.
# Broad recall comes from prosus.core; topic phrases add precise items beyond the ~100-item cap.

googlenews:
  base_url: https://news.google.com/rss/search
  editions:
    # The brief's English edition (hl=en&gl=NL&ceid=NL:en) does not exist: Google redirects it to
    # hl=en-US&gl=US&ceid=US:en (106/106 requests). en-US vs en-GB, 2026-10-19, 30-day items after
    # exclusions, deduped: Prosus 58 vs 57, "Fabricio Bloisi" 12 vs 12, "Delivery Hero" 55 vs 49,
    # Zalando 52 vs 50, intitle:Prosus intitle:AI 12 vs 12; total US 189, GB 180, union 194.
    # US >= GB on every phrase and the union adds 3% over US (< 25%), so one edition: en-US.
    en: {hl: en-US, gl: US, ceid: "US:en"}
    nl: {hl: nl, gl: NL, ceid: "NL:nl"}
  window_suffix: " when:30d"      # without it Google ranks by relevance and most items are older than 30 days
  max_items_per_query: 100        # Google News RSS returns at most 100 items per request
  min_seconds_between_requests: 3 # ~500 requests in 20 min at 1.5 s triggered a Google "unusual traffic" 503 block

prosus:
  core:
    - {id: prosus, q: 'Prosus', lang: any}
    - {id: prosus_nv, q: '"Prosus N.V."', lang: any}
    - {id: naspers_prosus, q: 'intitle:Naspers intitle:Prosus', lang: any}   # Naspers only together with Prosus
  # Recall phrases: body match, so they return Prosus items the core query misses (+45 on-Prosus items
  # in the 30-day test). Judged on "is it about Prosus" (<=20% not-Prosus after exclusions), not on topic;
  # classify.py assigns the topic. Rows from these get entity=company, topic left to the classifier.
  recall:
    - {id: india, q: 'Prosus India', lang: en}
    - {id: artificial_intelligence, q: 'Prosus "artificial intelligence"', lang: en}
    - {id: ai, q: 'Prosus AI', lang: any}
    - {id: ifood, q: 'Prosus iFood', lang: any}
    - {id: prosus_ventures, q: '"Prosus Ventures"', lang: any}
    - {id: board, q: 'Prosus board', lang: en}
    - {id: shareholders, q: 'Prosus shareholders', lang: en}
    - {id: investment, q: 'Prosus investment', lang: en}
    - {id: tencent_aandelen, q: 'Prosus Tencent aandelen', lang: nl}
    - {id: aandeelhouders, q: 'Prosus aandeelhouders', lang: nl}

executives:                       # key = `entity` value in data/articles.csv
  bloisi:
    name: Fabricio Bloisi
    role: Group Chief Executive Officer
    role_source: https://www.prosus.com/leadership
    queries:
      - {id: name, q: '"Fabricio Bloisi"', lang: any}
