# feeds.yaml -- verified source list (window C, checked 2026-10-19)
# Two sections, both read by collect.py:
#   rss         direct outlet feeds; verified yes = HTTP 200 and >= 1 entry
#   googlenews  one feed per queries.yaml phrase x edition (en = en-US/US, nl = nl/NL);
#               verified yes = HTTP 200 and >= 1 item in the last 30 days; skip entries with use: no
# paywalled yes = outlet paywalls articles; collect keeps headline + feed summary only.
# outlet_tier/paywalled are "mixed" for Google News: set per article from the outlet name.

